# Конфигурация линтера Ruff (ЛР3, раздел 3).
target-version = "py314"
line-length = 120
src = ["."]   # пакет src — собственный код проекта (first-party)

[lint]
select = [
    "E", "W",   # pycodestyle: ошибки и предупреждения стиля
    "F",        # pyflakes: неиспользуемые импорты и переменные, неопределённые имена
    "I",        # порядок импортов
    "B",        # flake8-bugbear: типичные ошибки (zip без strict, изменяемые аргументы и т. п.)
    "UP",       # pyupgrade: устаревшие конструкции для целевой версии Python
    "S",        # flake8-bandit: правила безопасности (дублируют часть Bandit на этапе линтера)
]

[lint.per-file-ignores]
# S101 (assert): в тестах pytest assert — штатный механизм проверки, а не защитная проверка
# в выполняемом коде приложения. В src/ assert по-прежнему запрещён.
"tests/**" = ["S101"]
